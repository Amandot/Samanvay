services:
  - type: web
    name: samanvay-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173"
      - key: CORS_ORIGIN_REGEX
        value: "^(https?://.*\\.vercel\\.app|https?://localhost(:\\d+)?|https?://127\\.0\\.0\\.1(:\\d+)?|https?://192\\.168\\.\\d+\\.\\d+(:\\d+)?|https?://10\\.\\d+\\.\\d+\\.\\d+(:\\d+)?|https?://172\\.(1[6-9]|2\\d|3[0-1])\\.\\d+\\.\\d+(:\\d+)?|https?://.*\\.onrender\\.com)$"

      - key: AUTO_SEED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false

